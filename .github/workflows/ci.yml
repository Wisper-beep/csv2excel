name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.3', '8.4', '8.5']
        include:
          - os: windows-latest
            php: '8.3'
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, zip, iconv
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
      - name: Lint templates and CLI
        shell: bash
        run: for f in templates/*.php bin/csv2excel public/index.php config.php; do php -l "$f"; done
      - name: Convert the problem files
        shell: bash
        run: php bin/csv2excel examples/*.csv examples/problem-files/0* -o problem-files-converted.xlsx
      - name: Upload converted workbook
        if: matrix.os == 'ubuntu-latest' && matrix.php == '8.3'
        uses: actions/upload-artifact@v7
        with:
          name: problem-files-converted
          path: problem-files-converted.xlsx
